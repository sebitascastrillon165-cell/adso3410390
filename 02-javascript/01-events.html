<body class="mainmenu javascript">

            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">

                    d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">

    <main>
        <header>
            <h1>01-Events</h1>
            <h3>Handle user interactions with events.</h3>
        </header>
        <section>
            <div class="house">
                <div class="info">
                    Press arrow keys: <br>
                    &larr; &uarr; &rarr; &darr;
                </div>
                <div class="controls">
                    <button class="btn-left">&larr;</button>
                    <button class="btn-up">&uarr;</button>
                    <button class="btn-rigth">&rarr;</button>
                    <button class="btn-down">&darr;</button>
                </div>
                <div id="trainer" class="down"></div>
            </div>
        </section>
    </main>
    <script>
        // Elements
        const trainer = document.getElementById('trainer');
        const btnLeft = document.querySelector('.btn-left');
        const btnUp = document.querySelector('.btn-up');
        const btnRigth = document.querySelector('.btn-rigth');
        const btnDown = document.querySelector('.btn-down');

        // Events

        
        btnLeft.addEventListener('click', function () {
            trainer.className = 'left'
        });
        btnUp.addEventListener('click', function () {
            trainer.className = 'up'
        });
        btnRigth.addEventListener('click', function () {
            trainer.className = 'rigth'
        });
        btnDown.addEventListener('click', function () {
            trainer.className = 'down'
        });
        
        // Events
        btnLeft.addEventListener('click', function () {
            trainer.className = 'left'
        });
        btnUp.addEventListener('click', function () {
            trainer.className = 'up'
        });
        btnRigth.addEventListener('click', function () {
            trainer.className = 'rigth'
        });
        btnDown.addEventListener('click', function () {
            trainer.className = 'down'
        });

        // NUEVO: Control por teclado usando las flechas
        document.addEventListener('keydown', function (event) {
            switch (event.key) {
                case 'ArrowLeft':
                    btnLeft.click();
                    break;
                case 'ArrowUp':
                    btnUp.click();
                    break;
                case 'ArrowRight':
                    btnRigth.click();
                    break;
                case 'ArrowDown':
                    btnDown.click();
                    break;
            }
        });
        
    </script>
</body>
