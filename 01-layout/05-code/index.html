<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cine Plaza </title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/master.css">
</head>
<body>
  <main>
    <header id="navbar">
      <img class="logo" src="images/logo.png" alt="Logo">
      <nav class="options">
        <a href="#cartelera" class="active">Cartelera</a>
        <a href="#proximos">Proximos</a>
        <a href="#actores">Actores</a>
        <a href="#ubicacion">Ubicacion</a>
      </nav>
    </header>
    <!-- 02-About -->
    <section id="cineplaza">
      <h2>cineplaza</h2>
      <img class="logo" src="images/logo.png" alt="Logo">
    </section>
    <!-- 03 Cartelera -->
    <section id="Cartelera">
      <h2>Cartelera</h2>
      <div class="filters">
        <button>Recomendados</button>
        <button class="active">Estrenos</button>
        <button>Proximos Estrenos</button>
      </div>
      <div class="cards">
        <figure class="card">
          <img class="peliculas" src="images/pelicula1.jpeg" alt="Pelicula 1">
          <h3>SUPER CANINO</h3>
          <h4> Genero | Duracion | Clasificacion 
            <br> Animado | 91 Minutos | Todos
          </h4>
          <h5>
            Director: Shea Wageman
            <br>Actores: Dawson Littman,Vicent Tong </br>
          </h5>
          <button class="ComprarEntrada">
            Comprar Entrada 
          </button>
        </figure>
        <figure class="card">
          <img class="peliculas" src="images/pelicula2.jpg" alt="Pelicula 2">
          <h3>LA ULTIMA TORMENTA</h3>
          <h4> Genero | Duracion | Clasificacion 
            <br> Accion | 83 Minutos | 12 Años
          </h4>
          <h5>
            Director: Taavi Vartia
            <br>Actores: Thea Sofie, Nikos Koukas </br>
          </h5>
          <button class="ComprarEntrada">
            Comprar Entrada 
          </button>
        </figure>
        <figure class="card">
          <img class="peliculas" src="images/pelicula3.jpg" alt="Pelicula 3">
          <h3>SPIDER-MAN</h3>
          <h4> Genero | Duracion | Clasificacion 
            <br> Ficcion | 145 Minutos | 12 Años </br>
          </h4>
          <h5>
            Director: Destin Daniel Cretton
            <br>Actores: Tramell Tillman </br>
          </h5>
          <button class="ComprarEntrada">
            Comprar Entrada 
          </button>
        </figure>
        <figure class="card">
          <img class="peliculas" src="images/pelicula4.jpg" alt="Pelicula 4">
          <h3>DUNA</h3>
          <h4> Genero | Duracion | Clasificacion 
            <br> Accion | 166 Minutos | 12 Años
          </h4>
          <h5>
            Director: Shea Wageman
            <br>Actores: Dawson Littman,Vicent Tong </br>
          </h5>
          <button class="ComprarEntrada">
            Comprar Entrada 
          </button>
        </figure>
      </div>
    </section>
    <a name="cartelera"></a>
    <!-- 04 Actores -->
     <section class="actores">
      <h2>Actores</h2>
     </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
